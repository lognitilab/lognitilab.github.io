<!-- Roboto Font -->
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />

<!-- Timeline Styles -->
<style>
  .section-heading {
    font-size: 1.2rem;
    font-weight: 600;
    color: #333;
    margin: 2rem 0 1rem 0;
    font-family: "Roboto", sans-serif;
  }

  .timeline-container {
    max-width: 1000px;
    margin: 2rem auto;
    padding: 1.5rem 2rem;
    background-color: #f9f9f9;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    font-family: "Roboto", sans-serif;
  }

  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
  }

  .logo-group {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .timeline-header img {
    height: 100px;
    object-fit: contain;
  }

  .timeline-title {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    line-height: 1.2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    text-align: left;
  }

  .underline {
    width: 167px;
    height: 2px;
    background-color: #666;
    margin-top: 0.3rem;
    margin-bottom: 0.3rem;
  }

  .timeline-subtitle {
    font-size: 1rem;
    color: #666;
    margin-top: 0.2rem;
    margin-bottom: 0;
    text-align: left;
  }

  .timeline-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
    margin-top: 1.2rem;
    font-size: 0.9rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .legend-color {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    display: inline-block;
  }

  .timeline-controls {
    display: flex;
    justify-content: flex-end;
    margin: 0.5rem 0;
  }

  .alumni-toggle {
    font-family: "Roboto", sans-serif;
    font-size: 0.85rem;
    color: #333;
    background-color: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
  }

  .alumni-toggle:hover {
    background-color: #f0f0f0;
  }

  @media (max-width: 768px) {
    .timeline-header {
      flex-direction: column;
      gap: 0.5rem;
    }

    .timeline-header img {
      height: 60px;
    }

    .logo-group {
      gap: 0.5rem;
    }
  }
</style>

<!-- Chart Header + Container -->
<div class="timeline-container">
  <div class="timeline-header">
    <div class="timeline-title">
      LogNiti Lab
      <div class="underline"></div>
      <div class="timeline-subtitle">Towards Sustainable and Resilient Freight</div>
    </div>
    <div class="logo-group">
      <img src="/assets/img/circular_logo.png" alt="LogNitiLab Logo" />
      <img src="/assets/img/iit_madras.svg" alt="IITM Logo" />
    </div>
  </div>

  <div class="timeline-controls">
    <button type="button" id="alumni-toggle" class="alumni-toggle" aria-pressed="false"></button>
  </div>

  <div id="gantt"></div>

  <div class="timeline-legend">
    <div class="legend-item"><span class="legend-color" style="background-color: #808080"></span> PI</div>
    <div class="legend-item"><span class="legend-color" style="background-color: #af6aaf"></span> PostDoc</div>
    <div class="legend-item"><span class="legend-color" style="background-color: #6a8daf"></span> PhD</div>
    <div class="legend-item"><span class="legend-color" style="background-color: #836950"></span> MS</div>
    <div class="legend-item"><span class="legend-color" style="background-color: #af8c6a"></span> MTech</div>
    <div class="legend-item"><span class="legend-color" style="background-color: #508350"></span> BTech</div>
    <div class="legend-item"><span class="legend-color" style="background-color: #6aaf6a"></span> Intern</div>
  </div>
</div>

<!-- Plotly -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<!-- Timeline Chart Script -->
<script>
  const roleColors = {
    "PI": "#808080",
    "PostDoc": "#af6aaf",
    "PhD": "#6a8daf",
    "MS": "#836950",
    "MTech": "#af8c6a",
    "BTech": "#508350",
    "Intern": "#6aaf6a"
  };

  const rawGanttData = {{ site.data.members | jsonify }};
  const today = new Date();
  const rowHeight = 24;
  const verticalMargin = 40; // margin.t + margin.b

  function buildBars(members) {
    const pastBars = [];
    const futureBars = [];

    members.forEach(member => {
      const start = new Date(member.start + "-01");
      const end = new Date(member.end + "-01");
      const roleColor = roleColors[member.role] || "#888";

      let pastStart, pastDuration, futureStart, futureDuration;

      if (today < start) {
        pastDuration = 0;
        futureDuration = end - start;
        futureStart = start;
      } else if (today >= end) {
        pastDuration = end - start;
        pastStart = start;
        futureDuration = 0;
      } else {
        pastDuration = today - start;
        futureDuration = end - today;
        pastStart = start;
        futureStart = today;
      }

      if (pastDuration > 0) {
        pastBars.push({
          type: "bar",
          x: [pastDuration],
          y: [member.name],
          base: pastStart.toISOString(),
          orientation: "h",
          marker: { color: roleColor },
          hoverinfo: "skip",
          showlegend: false
        });
      }

      if (futureDuration > 0) {
        futureBars.push({
          type: "bar",
          x: [futureDuration],
          y: [member.name],
          base: futureStart.toISOString(),
          orientation: "h",
          marker: { color: roleColor, opacity: 0.3 },
          hoverinfo: "skip",
          showlegend: false
        });
      }
    });

    return pastBars.concat(futureBars);
  }

  function buildLayout(rowCount) {
    return {
      title: "",
      barmode: "stack",
      showlegend: false,
      bargap: 0.15,
      height: rowCount * rowHeight + verticalMargin,
      font: {
        family: "Roboto, sans-serif",
        size: 13,
        color: "#333"
      },
      margin: {
        l: 150,
        r: 20,
        t: 20,
        b: 20
      },
      xaxis: {
        type: "date",
        range: ["2024-07-01", "2030-12-31"],
        tickformat: "%Y",
        dtick: "M60",
        side: "top",
        showgrid: true,
        gridcolor: "#ccc",
        gridwidth: 0.5,
        griddash: "solid"
      },
      yaxis: {
        automargin: true,
        tickfont: {
          size: 12
        }
      },
      shapes: [
        {
          type: "line",
          x0: today,
          x1: today,
          y0: -0.5,
          y1: rowCount - 0.5,
          line: { color: "red", width: 1 }
        },
      ]
    };
  }

  const toggle = document.getElementById("alumni-toggle");

  if (!Array.isArray(rawGanttData)) {
    document.getElementById("gantt").innerText = "Error: Member data is invalid.";
    toggle.style.display = "none";
  } else {
    const alumniCount = rawGanttData.filter(m => m.status === "completed").length;
    let showAlumni = false;

    function render() {
      const members = showAlumni ? rawGanttData : rawGanttData.filter(m => m.status !== "completed");
      Plotly.react("gantt", buildBars(members), buildLayout(members.length), { displayModeBar: false });
      toggle.textContent = showAlumni ? "Hide alumni" : `Show alumni (${alumniCount})`;
      toggle.setAttribute("aria-pressed", String(showAlumni));
    }

    if (alumniCount === 0) {
      toggle.style.display = "none";
    } else {
      toggle.addEventListener("click", () => {
        showAlumni = !showAlumni;
        render();
      });
    }

    render();
  }
</script>
